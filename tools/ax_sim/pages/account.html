<!doctype html><html><head><meta charset="utf-8"><title>account</title>
<style>
body{margin:0;font:14px Arial;background:#e9eef6}
.wrap{padding:16px;height:100%;box-sizing:border-box;overflow-y:auto}
.email{text-align:center;margin:8px 0 16px}
.pill{display:block;margin:0 auto 16px;width:220px;text-align:center;border:1px solid #747775;border-radius:20px;padding:8px;color:#0b57d0;text-decoration:none}
ul{list-style:none;padding:0;margin:0;background:#fff;border-radius:20px}
li a{display:flex;padding:12px 16px;color:#1f1f1f;text-decoration:none}
.btn{display:block;width:100%;padding:14px;border:0;background:#fff;border-radius:20px;margin-top:4px;text-align:left}
.foot{text-align:center;margin-top:12px}
.foot a{color:#444;font-size:12px}
</style></head><body><div class="wrap">
<div class="email">someone@example.com</div>
<a class="pill" href="#manage">Manage your Google Account</a>
<ul>
 <li><a href="#a1">Account One one@example.com</a></li>
 <li><a href="#a2">Account Two two@example.com</a></li>
</ul>
<button class="btn">Add another account</button>
<button class="btn">Sign out of all accounts</button>
<div class="foot"><a href="#p">Privacy Policy</a> · <a href="#t">Terms of Service</a></div>
</div></body></html>
